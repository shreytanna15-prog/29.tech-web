<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 875 875" width="240" height="240" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    /* dash pattern repeats every 2 units, so offset 1 and offset -1 look identical:
       draw in (1 -> 0), hold, then keep moving the same direction to erase (0 -> -1),
       and the loop restarts with no jump and no fade. */
    .s { fill: none; stroke: #eceff1; stroke-width: 54; stroke-linecap: butt; stroke-linejoin: miter;
         stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: flow 3.2s cubic-bezier(.65,0,.35,1) infinite; }
    .a { animation-delay: 0s; }
    .b { animation-delay: .2s; }
    .c { animation-delay: .4s; }
    @keyframes flow {
      0%   { stroke-dashoffset: 1; }
      40%  { stroke-dashoffset: 0; }
      60%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1; }
    }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; stroke-dashoffset: 0; } }
  </style>
  <path class="s a" pathLength="1" d="M175 365 C175 290 230 240 300 240 C375 240 435 290 435 365 C435 440 495 495 556 495"/>
  <path class="s b" pathLength="1" d="M390 456 L190 628 L492 628"/>
  <path class="s c" pathLength="1" d="M468 282 C490 255 535 240 585 240 C650 240 690 285 690 350 C690 400 640 500 553 650"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
